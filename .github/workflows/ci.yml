name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore NuGet packages
        run: dotnet restore LaneReady.sln

      - name: Build (treat warnings as errors)
        run: dotnet build LaneReady.sln --no-restore --configuration Release

      - name: Check for vulnerable packages
        run: dotnet list package --vulnerable --highest-severity 2>&1 | tee vuln-report.txt && ! grep -q 'has the following vulnerable packages' vuln-report.txt

      - name: Run domain unit tests
        run: dotnet test tests/LaneReady.Domain.Tests/LaneReady.Domain.Tests.csproj --no-build --configuration Release --verbosity normal

      - name: Run application unit tests
        run: dotnet test tests/LaneReady.Application.Tests/LaneReady.Application.Tests.csproj --no-build --configuration Release --verbosity normal

      - name: Run integration tests
        run: dotnet test tests/LaneReady.Integration.Tests/LaneReady.Integration.Tests.csproj --no-build --configuration Release --verbosity normal
        env:
          TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: /var/run/docker.sock
